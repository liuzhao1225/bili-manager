<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Bili Manager</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Bili Manager</h1>
        <p>读取当前 Chrome 的 B 站 Cookie，并在 Cookie 更新后自动同步。</p>
      </header>

      <label>
        Supabase URL
        <input id="supabaseUrl" type="url" placeholder="https://xxxx.supabase.co" autocomplete="off" />
      </label>

      <label>
        账号名称
        <input id="username" type="text" placeholder="留空则使用 B 站 UID" />
      </label>

      <label>
        Cookie 上传令牌
        <input id="uploadToken" type="password" placeholder="首次填写一次" />
      </label>

      <label class="toggle">
        <input id="autoSyncEnabled" type="checkbox" checked />
        <span>Cookie 更新后自动同步，并每 6 小时复核</span>
      </label>

      <button id="upload" type="button">上传当前 B 站 Cookie</button>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
